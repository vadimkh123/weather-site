stages:
  - test
  - build
  - deploy

test:
  stage: test
  image: alpine:latest
  script:
    - echo "Testing weather-site..."
    - test -f index.html
    - test -d css
    - test -d js
    - echo "Tests passed!"

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$DOCKERHUB_USER" -p "$DOCKERHUB_TOKEN"
  script:
    - docker build -t $DOCKERHUB_USER/weather-site:$CI_COMMIT_SHORT_SHA .
    - docker push $DOCKERHUB_USER/weather-site:$CI_COMMIT_SHORT_SHA

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan 192.168.1.109 >> ~/.ssh/known_hosts
  script:
    - ssh deploy@192.168.1.109 "docker pull $DOCKERHUB_USER/weather-site:$CI_COMMIT_SHORT_SHA && docker run -d --rm -p 8081:80 $DOCKERHUB_USER/weather-site:$CI_COMMIT_SHORT_SHA"
